<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ForFuture — Email</title>
    <!--
      Public URL: https://forfuture.app/email-change.html
      Allow-list in Supabase → Authentication → Redirect URLs (exact string).
      Used when changing email in Settings → Personal information.

      With “Secure email change” enabled, Supabase sends two confirmation emails.
      The first link opens with #message=… (step 1). The second link includes
      #access_token=…&type=email_change (step 2 — change complete).
    -->
    <link rel="icon" href="images/favicon.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="images/favicon-512.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png" sizes="180x180" />
    <link rel="stylesheet" href="auth-page.css" />
    <link rel="stylesheet" href="cookie-consent.css" />
    <script src="cookie-consent.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a href="index.html" class="logo" aria-label="ForFuture">
          <img src="images/forfuture-wordmark-dark.png" alt="ForFuture" class="logo-wordmark-header" width="200" height="32" />
        </a>
        <div class="header-actions">
          <div class="lang-switch" role="group" aria-label="Sprache wählen">
            <button type="button" class="lang-switch-btn is-active" data-lang="de" aria-pressed="true">DE</button>
            <button type="button" class="lang-switch-btn" data-lang="en" aria-pressed="false">EN</button>
          </div>
        </div>
      </div>
    </header>
    <main class="auth-main">
      <div class="auth-card" id="card">
      <h1 id="headline">ForFuture</h1>
      <p id="msg"></p>
      <div id="actions" class="auth-actions" hidden></div>
      <p class="muted" id="hint"></p>
      </div>
    </main>
    <script src="supabase-public-config.js"></script>
    <script src="auth-page.js"></script>
    <script type="module">
      const lang = window.ForFutureAuth?.detectLang?.() ?? (navigator.language.toLowerCase().startsWith('de') ? 'de' : 'en');
      const de = lang === 'de';
      const $ = (id) => document.getElementById(id);

      const headline = $('headline');
      const msg = $('msg');
      const actions = $('actions');
      const hint = $('hint');

      function addOpenAppButton() {
        actions.innerHTML = '';
        const open = document.createElement('a');
        open.href = 'forfuture2://';
        open.className = 'btn';
        open.textContent = de ? 'App öffnen' : 'Open app';
        actions.appendChild(open);
        actions.hidden = false;
      }

      function showError(title, body, foot) {
        document.title = de ? 'ForFuture — Link' : 'ForFuture — Link';
        headline.textContent = title;
        msg.classList.add('err');
        msg.textContent = body;
        if (foot) hint.textContent = foot;
      }

      function showSuccess(title, body, foot, withAppButton = true) {
        document.title = de ? 'ForFuture — Bestätigt' : 'ForFuture — Confirmed';
        headline.textContent = title;
        msg.classList.add('ok');
        msg.textContent = body;
        if (withAppButton) addOpenAppButton();
        if (foot) hint.textContent = foot;
      }

      function showInfo(title, body, foot) {
        document.title = de ? 'ForFuture — E-Mail' : 'ForFuture — Email';
        headline.textContent = title;
        msg.textContent = body;
        if (foot) hint.textContent = foot;
      }

      function resolveSupabaseConfig(accessToken) {
        return window.ForFutureAuth?.resolveSupabasePublicConfig?.(accessToken) ?? null;
      }

      /** Map Supabase #message=… redirects to friendly copy (secure email change step 1). */
      function friendlyMessage(raw) {
        const text = decodeURIComponent(String(raw).replace(/\+/g, ' ')).trim();
        const lower = text.toLowerCase();
        if (
          lower.includes('confirmation link accepted') &&
          lower.includes('other email')
        ) {
          return de
            ? {
                title: 'Erster Schritt bestätigt',
                body: 'Danke — dieser Bestätigungslink wurde akzeptiert. Öffne jetzt die E-Mail an deine andere Adresse und tippe dort auf den zweiten Link, um die Änderung abzuschließen.',
                hint: 'Prüfe auch den Spam-Ordner. Erst wenn beide Links bestätigt sind, ist die neue Adresse aktiv.',
              }
            : {
                title: 'First step confirmed',
                body: 'Thanks — this confirmation link was accepted. Now open the email we sent to your other address and tap the second link to finish the change.',
                hint: 'Check your spam folder too. Your new address is only active after both links are confirmed.',
              };
        }
        if (lower.includes('email') && lower.includes('changed')) {
          return de
            ? {
                title: 'E-Mail geändert',
                body: 'Deine E-Mail-Adresse wurde erfolgreich geändert.',
                hint: 'Du kannst zur ForFuture-App zurückkehren und dich mit der neuen Adresse anmelden.',
              }
            : {
                title: 'Email changed',
                body: 'Your email address has been successfully changed.',
                hint: 'You can return to the ForFuture app and sign in with your new address.',
              };
        }
        return de
          ? { title: 'Hinweis', body: text, hint: null }
          : { title: 'Notice', body: text, hint: null };
      }

      async function main() {
        const hash = window.location.hash?.replace(/^#/, '') ?? '';
        const hashParams = new URLSearchParams(hash);
        const qParams = new URLSearchParams(window.location.search);
        const flowType = hashParams.get('type') || qParams.get('type') || '';
        const accessToken = hashParams.get('access_token');
        const rawMessage = hashParams.get('message') || qParams.get('message');
        const err =
          hashParams.get('error') ||
          hashParams.get('error_code') ||
          qParams.get('error') ||
          qParams.get('error_description');

        if (err) {
          showError(
            de ? 'Link ungültig' : 'Link invalid',
            hashParams.get('error_description') ||
              qParams.get('error_description') ||
              err ||
              (de
                ? 'Der Bestätigungslink ist abgelaufen oder wurde bereits verwendet.'
                : 'This confirmation link has expired or was already used.'),
            de
              ? 'Fordere im ForFuture-App-Menü eine neue E-Mail-Bestätigung an.'
              : 'Request a new confirmation from the ForFuture app settings.',
          );
          return;
        }

        // Secure email change — step 1: Supabase redirects with #message= only (no tokens).
        if (rawMessage && !accessToken && !qParams.get('code')) {
          const copy = friendlyMessage(rawMessage);
          showInfo(copy.title, copy.body, copy.hint);
          return;
        }

        const sbConfig = resolveSupabaseConfig(accessToken);
        if (!sbConfig) {
          showError(
            de ? 'Konfiguration fehlt' : 'Configuration missing',
            de
              ? 'Supabase-Anon-Schlüssel fehlen auf dem Webserver (supabase-public-config.js).'
              : 'Supabase anon keys are missing on the web host (supabase-public-config.js).',
            null,
          );
          return;
        }
        const { url: sbUrl, anon: sbAnon } = sbConfig;
        const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2.49.4');
        const supabase = createClient(sbUrl, sbAnon, {
          auth: { detectSessionInUrl: true, persistSession: false },
        });

        const code = qParams.get('code');
        if (code) {
          const { error: exErr } = await supabase.auth.exchangeCodeForSession(window.location.href);
          if (exErr) {
            showError(de ? 'Fehler' : 'Error', exErr.message, null);
            return;
          }
        }

        const {
          data: { session },
          error: sessErr,
        } = await supabase.auth.getSession();
        if (sessErr) {
          showError(de ? 'Fehler' : 'Error', sessErr.message, null);
          return;
        }

        if (session) {
          const emailChanged = flowType === 'email_change' || Boolean(session.user?.email);
          if (emailChanged) {
            showSuccess(
              de ? 'E-Mail geändert' : 'Email changed',
              de
                ? 'Deine E-Mail-Adresse wurde erfolgreich geändert. Du kannst diese Seite schließen und zur ForFuture-App zurückkehren.'
                : 'Your email address has been successfully changed. You can close this page and return to the ForFuture app.',
              de
                ? 'Falls die App nicht startet, öffne ForFuture manuell und melde dich mit der neuen E-Mail an.'
                : 'If the app does not open, launch ForFuture manually and sign in with your new email.',
            );
          } else {
            showSuccess(
              de ? 'E-Mail bestätigt' : 'Email confirmed',
              de
                ? 'Deine Adresse ist bestätigt. Du kannst zur ForFuture-App zurückkehren.'
                : 'Your address is confirmed. You can return to the ForFuture app.',
              de
                ? 'Falls die App nicht startet, öffne ForFuture manuell.'
                : 'If the app does not open, launch ForFuture manually.',
            );
          }
          return;
        }

        showInfo(
          de ? 'Fast geschafft' : 'Almost done',
          de
            ? 'Es wurde keine Sitzung aus dem Link gelesen. Öffne den Link erneut im Browser.'
            : 'No session was read from this link. Try opening the link again in your browser.',
          de
            ? 'Stelle sicher, dass https://forfuture.app/email-change.html in Supabase unter „Redirect URLs“ eingetragen ist.'
            : 'Ensure https://forfuture.app/email-change.html is listed under Supabase → Redirect URLs.',
        );
      }

      void main().catch(() => {
        showError(
          de ? 'Fehler' : 'Error',
          de
            ? 'Die Seite konnte den Link nicht verarbeiten. Bitte erneut öffnen.'
            : 'This page could not process the link. Please try opening it again.',
          null,
        );
      });
    </script>
  </body>
</html>
